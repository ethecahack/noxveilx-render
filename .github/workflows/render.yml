name: NoxveilX - render & publish

on:
  schedule:
    # Rendering runs ahead of time, several times a day. Publishing time does NOT depend on these runs:
    # n8n uploads each video to YouTube as a scheduled video (publishAt), and YouTube itself
    # releases it at the exact slot: shorts daily 2:00 PM Riyadh, long videos Mon/Wed/Fri 2:00 PM Riyadh.
    - cron: "17 1 * * *"
    - cron: "43 5 * * *"
    - cron: "11 9 * * *"
    - cron: "37 13 * * *"
    - cron: "7 17 * * *"
    - cron: "29 21 * * *"
  push:
    # committing a change to .github/run-now starts a run right away.
    # if that file contains the word "dry", the video is rendered but NOT published (kept as an artifact).
    paths: [".github/run-now"]
  workflow_dispatch:
    inputs:
      formats:
        description: "short,long | short | long"
        default: "short,long"
      dry_run:
        description: "1 = render only, do not publish"
        default: "0"

concurrency:
  group: noxveilx-render
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation fonts-dejavu-core > /dev/null
          mkdir -p ~/.fonts
          curl -fsSL -o ~/.fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf || true
          fc-cache -f > /dev/null
          if fc-list | grep -qi anton; then echo "CAPTION_FONT=Anton" >> $GITHUB_ENV; echo "THUMB_FONT=$HOME/.fonts/Anton-Regular.ttf" >> $GITHUB_ENV; else echo "CAPTION_FONT=Liberation Sans" >> $GITHUB_ENV; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Decide mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DRY="${{ github.event.inputs.dry_run || '0' }}"
          if [ "${{ github.event_name }}" = "push" ] && grep -qi dry .github/run-now; then DRY=1; fi
          FORMATS="${{ github.event.inputs.formats || 'short,long' }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            if grep -qi "long-only" .github/run-now; then FORMATS=long; fi
            if grep -qi "short-only" .github/run-now; then FORMATS=short; fi
          fi
          SKIP=0
          echo "SKIP=$SKIP" >> $GITHUB_ENV
          echo "DRY_RUN=$DRY" >> $GITHUB_ENV
          echo "FORMATS=$FORMATS" >> $GITHUB_ENV
          echo "dry=$DRY formats=$FORMATS"

      - name: Render and publish
        if: env.SKIP != '1'
        env:
          NOXVEIL_TOKEN: ${{ secrets.NOXVEIL_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          N8N_BASE_URL: https://farizk16.app.n8n.cloud
          LANGS: en
          MAX_PER_FORMAT: "3"
          PYTHONUNBUFFERED: "1"
        run: python make_short.py --n8n

      - name: Keep log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-log-${{ github.run_id }}
          path: logs/worker.log
          retention-days: 14

      - name: Keep dry-run video
        if: always() && env.DRY_RUN == '1'
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.run_id }}
          path: |
            output/**/final.mp4
            output/**/thumbnail.jpg
          retention-days: 7

      - name: Preview frames (dry run)
        if: always() && env.DRY_RUN == '1'
        run: |
          set -e
          if [ -z "$(find output -name final.mp4 2>/dev/null)" ]; then echo "nothing rendered"; exit 0; fi
          mkdir -p /tmp/prev
          for v in $(find output -name final.mp4); do
            n=$(basename $(dirname $v)); d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 $v)
            for k in 1 2 3 4 5 6 7 8; do t=$(python3 -c "print(round($d*($k-0.5)/8,2))"); ffmpeg -loglevel error -y -ss $t -i $v -frames:v 1 -vf scale=480:-1 /tmp/prev/${n}_$k.jpg; done
            ffmpeg -loglevel error -y -pattern_type glob -i "/tmp/prev/${n}_*.jpg" -vf tile=4x2 /tmp/prev/sheet_${n}.jpg
          done
          for t in $(find output -name thumbnail.jpg); do cp $t /tmp/prev/thumb_$(basename $(dirname $t)).jpg; done
          git config user.name "noxveilx-bot"; git config user.email "bot@noxveilx.local"
          git fetch origin previews || true
          git switch --orphan previews-tmp
          rm -rf ./* .github 2>/dev/null || true
          cp /tmp/prev/sheet_* /tmp/prev/thumb_* . 2>/dev/null || true
          git add -A && git commit -qm "preview ${{ github.run_id }}" && git push -f origin HEAD:previews
